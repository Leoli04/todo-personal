<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Todo · GitHub 同步</title>
<style>
/* ---------------------------------------------------------------- tokens */
/* 主题三态：auto（默认，跟随系统）/ light / dark —— 后两者由 <html data-theme> 显式指定。
   浅色变量出现两处（显式浅色 + 系统浅色），check-ui.js 用 CSSOM 比对两处的变量名与值；
   改色板必须两边一起改，否则那条断言会红。 */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1013;
  --surface: #16191f;
  --surface-2: #1c2027;
  --line: #262b33;
  --line-strong: #3d4554;
  --line-soft: #1f242c;
  --text: #e8eaef;
  --muted: #8b94a3;
  --accent: #5b9dff;
  --accent-soft: rgba(91, 157, 255, 0.14);
  --ok: #3fb950;
  --warn: #d29922;
  --err: #f85149;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
  --r: 12px;
  --r-sm: 8px;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --line: #e2e6ec;
  --line-strong: #c2cad6;
  --line-soft: #eef1f5;
  --text: #16191f;
  --muted: #626a78;
  --accent: #1f6feb;
  --accent-soft: rgba(31, 111, 235, 0.1);
  --ok: #1a7f37;
  --warn: #9a6700;
  --err: #cf222e;
  --shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --line: #e2e6ec;
    --line-strong: #c2cad6;
    --line-soft: #eef1f5;
    --text: #16191f;
    --muted: #626a78;
    --accent: #1f6feb;
    --accent-soft: rgba(31, 111, 235, 0.1);
    --ok: #1a7f37;
    --warn: #9a6700;
    --err: #cf222e;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 800px;
  margin: 0 auto;
  padding: 22px 20px 120px;
  position: relative;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------------- top */
.top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
}

.brand { display: flex; gap: 12px; align-items: center; min-width: 0; }

.brand-mark {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 11px;
  background: linear-gradient(150deg, var(--accent), #7c5bff);
  color: #fff;
  font-size: 19px;
  font-weight: 700;
  flex: none;
  box-shadow: 0 4px 14px rgba(91, 157, 255, 0.28);
}

.brand h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand .sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}

.top-actions { display: flex; align-items: center; gap: 6px; flex: none; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  flex: none;
}

.chip-label { white-space: nowrap; flex: 0 0 auto; }

.chip--demo { border-color: rgba(210, 153, 34, 0.4); }

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot--ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.16); }
.dot--busy { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.dot--warn { background: var(--warn); }
.dot--err { background: var(--err); }
.dot--idle { background: var(--muted); }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.28; } }

.icon-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  color: var(--muted);
  transition: background 0.16s, color 0.16s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
/* 齿轮用 24 的 viewBox，全局 1.6 的线宽缩到 16 会偏细，这里补回来 */
.ico-gear { stroke-width: 1.9; }
.spin { animation: spin 0.9s linear infinite; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ----------------------------------------------------------------- stats */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 14px 10px;
  margin-bottom: 14px;
}

.stat { display: flex; flex-direction: column; gap: 1px; }
.stat b { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat span { font-size: 11.5px; color: var(--muted); }
.stat--warn b { color: var(--warn); }

.bar {
  grid-column: 1 / -1;
  height: 4px;
  border-radius: 999px;
  background: var(--line-soft);
  overflow: hidden;
  margin-top: 8px;
}
.bar i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--accent), #7c5bff);
  border-radius: 999px;
  transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* ---------------------------------------------------------------- banner */
.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 9px 13px;
  border-radius: var(--r-sm);
  font-size: 13px;
  margin-bottom: 12px;
  border: 1px solid transparent;
}
.banner--demo { background: var(--accent-soft); border-color: rgba(91, 157, 255, 0.25); color: var(--text); }
.banner--draft { background: rgba(210, 153, 34, 0.1); border-color: rgba(210, 153, 34, 0.3); }
.banner--warn { background: rgba(248, 81, 73, 0.1); border-color: rgba(248, 81, 73, 0.3); }

.link {
  color: var(--accent);
  font-size: 13px;
  padding: 2px 0;
  white-space: nowrap;
}
.link:hover { text-decoration: underline; }

/* --------------------------------------------------------------- toolbar */
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }

.search-wrap { position: relative; flex: 1 1 200px; min-width: 150px; }
.search-ico {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--muted); width: 14px; height: 14px; pointer-events: none;
}
.search-wrap input {
  width: 100%;
  height: 34px;
  padding: 0 11px 0 32px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  outline: none;
  transition: border-color 0.16s;
}
.search-wrap input:focus { border-color: var(--accent); }

.seg {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 2px;
  height: 34px;
}
.seg button {
  padding: 0 11px;
  font-size: 13px;
  color: var(--muted);
  border-radius: 6px;
  transition: background 0.16s, color 0.16s;
}
.seg button.on { background: var(--surface-2); color: var(--text); font-weight: 550; }
.seg--off { opacity: 0.45; pointer-events: none; }

.view-toggle { display: inline-flex; gap: 2px; height: 34px; align-items: center; }
.view-toggle button {
  padding: 0 10px; height: 28px;
  font-size: 12.5px; color: var(--muted);
  border-radius: 6px;
}
.view-toggle button.on { background: var(--surface-2); color: var(--text); }

/* ---------------------------------------------------------------- tagbar */
.tagbar {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 14px;
  max-height: 78px;
  overflow-y: auto;
}
.tag {
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  background: transparent;
  transition: all 0.16s;
  white-space: nowrap;
}
.tag:hover { color: var(--text); border-color: var(--muted); }
.tag--on { background: var(--accent-soft); border-color: rgba(91, 157, 255, 0.45); color: var(--accent); }
.clear-tags { font-size: 12px; color: var(--muted); padding: 3px 6px; }
.clear-tags:hover { color: var(--text); }

/* ---------------------------------------------------------------- groups */
.group { margin-bottom: 22px; }
.group-head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 0 2px 8px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 8px;
}
.group-head h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--muted);
  text-transform: uppercase;
}
.group-count { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ----------------------------------------------------------------- tasks */
.task-list { list-style: none; margin: 0; padding: 0; }

.task {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 8px 9px 6px;
  border-radius: var(--r-sm);
  transition: background 0.14s;
  position: relative;
}
.task:hover { background: var(--surface); }

.check {
  flex: none;
  width: 20px; height: 20px;
  margin-top: 1px;
  border-radius: 6px;
  border: 1.6px solid var(--line-strong);
  display: grid; place-items: center;
  color: transparent;
  transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.check:hover { border-color: var(--accent); }
.check svg { width: 12px; height: 12px; stroke-width: 2.2; }
.task--done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
.task--done .task-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }

.task-main { min-width: 0; flex: 1; }
.task-title {
  font-size: 14.5px;
  word-break: break-word;
  cursor: text;
  padding: 1px 0;
  border-radius: 4px;
  transition: color 0.14s;
}
.task--over .task-title { color: var(--err); }

.edit {
  width: 100%;
  font-size: 14.5px;
  padding: 3px 7px;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: var(--surface-2);
  outline: none;
}

.task-meta { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 3px; align-items: center; }
.task-meta .tag { font-size: 11.5px; padding: 1px 7px; }
.due { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.due--over { color: var(--err); }
.prio { font-size: 10.5px; font-weight: 650; padding: 1px 5px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.prio--1 { background: rgba(248, 81, 73, 0.14); color: var(--err); }
.prio--2 { background: rgba(210, 153, 34, 0.14); color: var(--warn); }

.task-del { opacity: 0; width: 26px; height: 26px; margin-top: -2px; flex: none; }
.task:hover .task-del, .task:focus-within .task-del { opacity: 1; }
.task-del:hover { color: var(--err); }

.task--done { opacity: 0.62; }

/* ----------------------------------------------------------------- board */
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.col {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 10px;
  min-height: 120px;
}
.col-head {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--muted);
  padding: 2px 6px 8px;
}
.col-head b { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); }
.col .task:hover { background: var(--surface-2); }
.empty-mini { list-style: none; color: var(--muted); font-size: 13px; padding: 10px 6px; }

.empty {
  text-align: center;
  color: var(--muted);
  font-size: 13.5px;
  padding: 44px 0;
}

/* -------------------------------------------------------------- composer */
.composer {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 800px;
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 8px;
  background: linear-gradient(to top, var(--bg) 62%, transparent);
  z-index: 20;
}

.composer select {
  height: 38px;
  max-width: 120px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 0 8px;
  font-size: 13px;
  outline: none;
}
.composer input {
  flex: 1;
  height: 38px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 0 12px;
  outline: none;
  transition: border-color 0.16s;
  min-width: 0;
}
.composer input:focus { border-color: var(--accent); }
.composer input::placeholder { color: var(--muted); }

.btn-primary {
  height: 38px;
  padding: 0 16px;
  border-radius: var(--r-sm);
  background: var(--accent);
  color: #fff;
  font-size: 13.5px;
  font-weight: 550;
  transition: filter 0.16s;
  white-space: nowrap;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost {
  height: 38px;
  padding: 0 14px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  font-size: 13.5px;
  color: var(--text);
}
.btn-ghost:hover { background: var(--surface-2); }

/* ------------------------------------------------------------------ foot */
.foot {
  display: flex; gap: 7px; align-items: center;
  font-size: 11.5px;
  color: var(--muted);
  padding: 10px 2px 0;
  font-variant-numeric: tabular-nums;
}
.foot .sep { opacity: 0.5; }
.warn-mark { color: var(--warn); font-weight: 600; }

/* ---------------------------------------------------------------- drawer */
.drawer-mask {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 40;
  animation: fade 0.18s ease;
}
@keyframes fade { from { opacity: 0; } }

.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(400px, 92vw);
  background: var(--surface);
  border-left: 1px solid var(--line);
  z-index: 41;
  padding: 18px 20px 24px;
  overflow-y: auto;
  box-shadow: var(--shadow);
  animation: slide 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes slide { from { transform: translateX(24px); opacity: 0.6; } }

.drawer header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.drawer h3 { margin: 0; font-size: 15px; font-weight: 600; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; }
.field > span { font-size: 12px; color: var(--muted); }
.field input[type="text"], .field input[type="password"], .field input:not([type]), .field select {
  height: 34px;
  padding: 0 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface-2);
  outline: none;
  width: 100%;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field .row { display: flex; align-items: center; gap: 6px; }
.field .slash { color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }


.hint { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin: -4px 0 14px; }
.ok-mark { color: var(--ok); font-style: normal; font-size: 11px; }

.drawer-actions { display: flex; gap: 8px; margin-top: 8px; }
.drawer-actions .btn-primary { flex: 1; }

.drawer-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 24px; padding-top: 14px;
  border-top: 1px solid var(--line-soft);
  font-size: 11.5px; color: var(--muted);
}
.foot-links { display: flex; gap: 14px; flex-wrap: wrap; }
.hint--foot { margin: 10px 0 0; }

/* ----------------------------------------------------------------- toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 74px;
  transform: translateX(-50%);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 15px;
  font-size: 13px;
  box-shadow: var(--shadow);
  z-index: 60;
  max-width: 86vw;
  animation: rise 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }
.toast--ok { border-color: rgba(63, 185, 80, 0.45); }
.toast--warn { border-color: rgba(210, 153, 34, 0.45); }
.toast--err { border-color: rgba(248, 81, 73, 0.45); }

/* ------------------------------------------------------------------ rwd */
@media (max-width: 720px) {
  #app { padding: 16px 14px 130px; }
  .brand h1 { font-size: 15.5px; }
  .brand .sub { font-size: 11px; }
  .chip-label { display: none; }
  .chip { padding: 0; width: 28px; justify-content: center; }
  .stats { grid-template-columns: repeat(4, 1fr); padding: 10px 12px; }
  .stat b { font-size: 17px; }
  .board { grid-template-columns: 1fr; }
  .task { padding: 10px 6px; }
  .task-del { opacity: 0.55; }
  .composer { padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .composer select { max-width: 92px; }
  .toolbar .view-toggle { display: none; }
  .drawer { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

 * 支持的语法（面向人，GitHub 原生渲染可读）：
 *   # 分组
 *   - [ ] 任务标题 #标签 @due(2026-11-05) !p1 <!--id:a1b2c3d-->
 *   - [x] 已完成 <!--id:a1b2c3d @done(2026-11-03)-->
 */

const TASK_RE = /^(\s*)[-*+]\s+\[([ xX])\]\s+(.*)$/;
const HEADING_RE = /^(#{1,6})\s+(.+?)\s*#*\s*$/;
const FENCE_RE = /^\s*(```|~~~)/;
const TRAILING_COMMENT_RE = /\s*<!--([\s\S]*?)-->\s*$/;
const ID_RE = /(?:^|\s)id:([A-Za-z0-9_-]{1,64})(?=\s|$)/;
const DONE_RE = /@done\(\s*(\d{4}-\d{2}-\d{2})\s*\)/;
const DUE_RE = /@due\(\s*(\d{4}-\d{2}-\d{2})\s*\)/;
const PRIO_RE = /(?:^|\s)!p([0-3])\b/i;
// 首字符必须是字母或汉字：避免把「工单 #8821」里的工单号当成标签。
const TAG_RE = /(?:^|\s)#([A-Za-z\u4e00-\u9fa5][\w\u4e00-\u9fa5/-]*)/g;

/* ---------------------------------------------------------------- utils */

function detectEol(src) {
  const i = src.indexOf('\n');
  return i > 0 && src[i - 1] === '\r' ? '\r\n' : '\n';
}

function hash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

function base36(n, width) {
  return n.toString(36).padStart(width, '0').slice(-width);
}

/** 确定性 id：同 (分组, 标题) 恒得同一值，跨设备一致，便于合并 */
function deriveId(group, title) {
  return 'e' + base36(hash32(`${group}\u0000${title}`), 7);
}

function randomId() {
  const rnd = Math.floor(Math.random() * 0xffffffff);
  return 'i' + base36(hash32(String(Date.now()) + String(rnd)), 7);
}

function todayISO(d = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/* ---------------------------------------------------------------- parse */

/**
 * 把行内文本拆成 { title, tags, due, priority, id, doneAt }
 */
function parseInline(rest, group) {
  let body = rest;
  let id = null;
  let doneAt = null;
  let hadComment = false;

  const cm = body.match(TRAILING_COMMENT_RE);
  if (cm) {
    hadComment = true;
    body = body.slice(0, cm.index);
    const inner = cm[1];
    const im = inner.match(ID_RE);
    if (im) id = im[1];
    const dm = inner.match(DONE_RE);
    if (dm) doneAt = dm[1];
  }

  let priority = null;
  const pm = body.match(PRIO_RE);
  if (pm) {
    priority = Number(pm[1]);
    body = body.replace(PRIO_RE, ' ');
  }

  let due = null;
  const duem = body.match(DUE_RE);
  if (duem) {
    due = duem[1];
    body = body.replace(DUE_RE, ' ');
  }

  const tags = [];
  let tm;
  TAG_RE.lastIndex = 0;
  while ((tm = TAG_RE.exec(body))) tags.push(tm[1]);
  if (tags.length) body = body.replace(TAG_RE, ' ');

  const title = body.replace(/\s+/g, ' ').trim();
  const ephemeral = !id;
  if (!id) id = deriveId(group, title);

  return { title, tags, due, priority, id, doneAt, ephemeral, hadComment };
}

/**
 * 文件里是否存在二级及以下标题。有 → 首个 h1 视为文档标题；
 * 没有 → 全篇 h1 都是分组（照顾「# 工作 / # 生活」这种极简写法）。
 */
function hasSubHeading(lines) {
  let fence = null;
  let inFm = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (i === 0 && line.trim() === '---') { inFm = true; continue; }
    if (inFm) { if (line.trim() === '---') inFm = false; continue; }
    const fm = line.match(FENCE_RE);
    if (fm) {
      if (!fence) fence = fm[1];
      else if (line.trim().startsWith(fence)) fence = null;
      continue;
    }
    if (fence) continue;
    const hm = line.match(HEADING_RE);
    if (hm && hm[1].length >= 2) return true;
  }
  return false;
}

/**
 * @returns {{eol:string, bom:boolean, lines:string[], tasks:Task[], groups:Group[]}}
 */
function parse(src) {
  const bom = src.charCodeAt(0) === 0xfeff;
  const text = bom ? src.slice(1) : src;
  const eol = detectEol(text);
  const lines = text.split(/\r?\n/);
  const sub = hasSubHeading(lines);

  const tasks = [];
  const groups = [];
  let fence = null;
  let inFrontMatter = false;
  let currentGroup = '';
  let currentGroupLevel = 0;
  let titleTaken = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // front matter：仅文件开头第一行 --- 才生效
    if (i === 0 && line.trim() === '---') { inFrontMatter = true; continue; }
    if (inFrontMatter) {
      if (line.trim() === '---') { inFrontMatter = false; }
      continue;
    }

    const fm = line.match(FENCE_RE);
    if (fm) {
      if (!fence) fence = fm[1];
      else if (line.trim().startsWith(fence)) fence = null;
      continue;
    }
    if (fence) continue;

    const hm = line.match(HEADING_RE);
    if (hm) {
      const level = hm[1].length;
      const title = hm[2].trim();
      // 首个 h1 + 存在子标题 ⇒ 文档标题，不参与分组，也不改变当前分组
      if (level === 1 && sub && !titleTaken) {
        titleTaken = true;
        groups.push({ title, level, lineIndex: i, role: 'title' });
        continue;
      }
      currentGroup = title;
      currentGroupLevel = level;
      groups.push({ title, level, lineIndex: i, role: 'group' });
      continue;
    }

    const tm = line.match(TASK_RE);
    if (!tm) continue;

    const indent = tm[1].replace(/\t/g, '  ');
    const checked = tm[2].toLowerCase() === 'x';
    const inline = parseInline(tm[3], currentGroup);

    tasks.push({
      ...inline,
      checked,
      indent,
      group: currentGroup,
      groupLevel: currentGroupLevel,
      lineIndex: i,
      raw: line,
    });
  }

  return { eol, bom, lines, tasks, groups };
}

/* ------------------------------------------------------------ serialize */

function buildTaskLine(t) {
  const parts = [];
  if (t.title) parts.push(t.title);
  for (const tag of t.tags || []) parts.push('#' + tag);
  if (t.due) parts.push(`@due(${t.due})`);
  if (typeof t.priority === 'number') parts.push(`!p${t.priority}`);

  let line = `${t.indent || ''}- [${t.checked ? 'x' : ' '}] ${parts.join(' ')}`.trimEnd();

  const meta = [];
  if (t.id && !t.ephemeral) meta.push(`id:${t.id}`);
  if (t.doneAt) meta.push(`@done(${t.doneAt})`);
  if (meta.length) line += ` <!--${meta.join(' ')}-->`;
  return line;
}

function join(doc) {
  return (doc.bom ? '\uFEFF' : '') + doc.lines.join(doc.eol);
}

/* --------------------------------------------------------------- mutate */

function findTask(doc, id) {
  return doc.tasks.find((t) => t.id === id && !t.ephemeral) ||
         doc.tasks.find((t) => t.id === id);
}

/**
 * 对单个任务行做原地补丁。返回 { src, changed, task?, error? }
 */
function patchTask(src, id, mutator) {
  const doc = parse(src);
  const t = findTask(doc, id);
  if (!t) return { src, changed: false, error: 'task-not-found' };

  const next = { ...t, tags: [...t.tags] };
  const before = JSON.stringify({ ...t, lineIndex: 0, raw: 0 });
  mutator(next);

  // 改动落到这一行时才固化 id，保证其余行零 diff
  if (next.ephemeral) { next.id = randomId(); next.ephemeral = false; }

  const after = JSON.stringify({ ...next, lineIndex: 0, raw: 0 });
  if (before === after) return { src, changed: false, task: t };

  doc.lines[t.lineIndex] = buildTaskLine(next);
  return { src: join(doc), changed: true, task: next };
}

function toggleTask(src, id, checked, opts = {}) {
  return patchTask(src, id, (t) => {
    t.checked = checked;
    if (opts.trackDoneDate) t.doneAt = checked ? todayISO() : null;
  });
}

function updateTask(src, id, patch) {
  return patchTask(src, id, (t) => Object.assign(t, patch));
}

function removeTask(src, id) {
  const doc = parse(src);
  const t = findTask(doc, id);
  if (!t) return { src, changed: false, error: 'task-not-found' };
  doc.lines.splice(t.lineIndex, 1);
  // 清理可能留下的连续空行（最多 1 行，避免吃掉用户的排版）
  if (doc.lines[t.lineIndex] === '' && doc.lines[t.lineIndex - 1] === '') {
    doc.lines.splice(t.lineIndex, 1);
  }
  return { src: join(doc), changed: true };
}

/**
 * 追加任务。有同名分组则插到该分组最后一个任务之后；否则新建分组。
 */
function addTask(src, { group, title, tags = [], due = null, priority = null, checked = false }) {
  const doc = parse(src);
  const clean = String(title || '').trim();
  if (!clean) return { src, changed: false, error: 'empty-title' };

  const task = {
    id: randomId(),
    ephemeral: false,
    checked,
    title: clean,
    tags,
    due,
    priority,
    doneAt: checked ? todayISO() : null,
  };

  const g = doc.groups.find((x) => x.title === group && x.role === 'group');
  const line = buildTaskLine({ ...task, indent: '' });

  if (!g) {
    // 新建分组：沿用现有分组的标题层级，缺省 h2；文件末尾追加，前后留空行
    const peer = doc.groups.find((x) => x.role === 'group');
    const hashes = '#'.repeat(peer ? peer.level : 2);
    const tail = doc.lines[doc.lines.length - 1];
    if (tail !== undefined && tail.trim() !== '') doc.lines.push('');
    doc.lines.push(`${hashes} ${group || '未分组'}`, '', line);
  } else {
    const inGroup = doc.tasks.filter((t) => t.group === group);
    if (inGroup.length) {
      const last = inGroup[inGroup.length - 1];
      doc.lines.splice(last.lineIndex + 1, 0, line);
    } else {
      // 分组存在但为空：插在标题行之后（跳过一个空行）
      let at = g.lineIndex + 1;
      if (doc.lines[at] === '') at += 1;
      doc.lines.splice(at, 0, line);
    }
  }

  return { src: join(doc), changed: true, task };
}

/* -------------------------------------------------------------- helpers */

function stats(tasks) {
  const total = tasks.length;
  const done = tasks.filter((t) => t.checked).length;
  return { total, done, open: total - done, pct: total ? Math.round((done / total) * 100) : 0 };
}

function isOverdue(task, ref = todayISO()) {
  return !!task.due && !task.checked && task.due < ref;
}

function groupBy(tasks, keyFn) {
  const map = new Map();
  for (const t of tasks) {
    const k = keyFn(t);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(t);
  }
  return map;
}


/* ---- src/core/merge.mjs ---- */
/**
 * merge.mjs —— 三方合并（base / local / remote）
 *
 * 场景：手机在 GitHub 上勾了一个任务，电脑这边也改了另一条，然后点「推送」。
 * 没有合并就会整文件覆盖，把远端那次勾选吞掉。
 *
 * 策略：
 *  - 结构以 remote 为准（标题、空行、注释、任务顺序都跟远端），本地不重排。
 *  - 逐任务按 id 对齐，逐字段三态判定：谁改了用谁，两边都改才叫冲突。
 *  - 本地新增 → 插到所属分组的标题行之后；本地删除 → 从 remote 里摘掉。
 *  - 冲突时保留本地值并上报，由用户决定，不静默丢数据。
 */


const FIELDS = ['checked', 'title', 'tags', 'due', 'priority'];

function norm(task, key) {
  if (!task) return '';
  const v = task[key];
  if (Array.isArray(v)) return v.join('\u0001');
  return v === null || v === undefined ? '' : String(v);
}

function mergeField(base, local, remote, key) {
  const b = norm(base, key);
  const l = norm(local, key);
  const r = norm(remote, key);
  if (l === r || r === b) return { value: local ? local[key] : remote[key], conflict: false };
  if (l === b) return { value: remote[key], conflict: false };
  return { value: local[key], conflict: true }; // 两边都改且不同
}

function indexById(doc) {
  const m = new Map();
  for (const t of doc.tasks) {
    // ephemeral id 是按「分组+标题」派生的，可能撞车，再兜一层序号
    let key = t.id;
    let n = 1;
    while (m.has(key)) key = `${t.id}#${n++}`;
    m.set(key, t);
  }
  return m;
}

/**
 * @returns {{src:string, conflicts:Array<{id:string, field:string}>, added:number, removed:number}}
 */
function mergeMarkdown(baseSrc, localSrc, remoteSrc) {
  if (localSrc === baseSrc) return { src: remoteSrc, conflicts: [], added: 0, removed: 0, fastPath: 'no-local-change' };
  if (remoteSrc === baseSrc) return { src: localSrc, conflicts: [], added: 0, removed: 0, fastPath: 'no-remote-change' };

  const base = parse(baseSrc);
  const local = parse(localSrc);
  const remote = parse(remoteSrc);

  const byId = (doc) => {
    const m = new Map();
    for (const t of doc.tasks) {
      const k = t.ephemeral ? deriveId(t.group, t.title) : t.id;
      if (!m.has(k)) m.set(k, t);
    }
    return m;
  };

  const bMap = byId(base);
  const lMap = byId(local);
  const rMap = byId(remote);
  if (rMap.size && !lMap.size && bMap.size === rMap.size) {
    // 本地被清空得离谱（多半是解析异常），宁可放弃合并也不毁数据
    return { src: remoteSrc, conflicts: [], added: 0, removed: 0, fastPath: 'suspicious-local' };
  }

  const conflicts = [];
  const removed = [];
  const addedByGroup = new Map();

  // 本地删除：在 base 里存在、local 里不存在
  for (const [id, t] of bMap) {
    if (!lMap.has(id)) removed.push(id);
  }
  // 本地新增：local 里有、base 里没有
  for (const [id, t] of lMap) {
    if (!bMap.has(id)) {
      if (!addedByGroup.has(t.group)) addedByGroup.set(t.group, []);
      addedByGroup.get(t.group).push(t);
    }
  }

  const remoteLineToTask = new Map(remote.tasks.map((t) => [t.lineIndex, t]));
  const rIdOf = new Map(remote.tasks.map((t) => [t.id, t]));

  const out = [];
  const emittedGroups = new Set();

  const flushAdded = (groupName) => {
    if (!groupName || emittedGroups.has(groupName)) return;
    const list = addedByGroup.get(groupName);
    if (!list) return;
    emittedGroups.add(groupName);
    for (const t of list) {
      out.push(buildTaskLine({ ...t, indent: t.indent || '', ephemeral: false }));
    }
  };

  for (let i = 0; i < remote.lines.length; i++) {
    const g = remote.groups.find((x) => x.lineIndex === i);
    if (g && g.role !== 'title') {
      out.push(remote.lines[i]);
      flushAdded(g.title); // 新增任务落在分组标题之后
      continue;
    }

    const rt = remoteLineToTask.get(i);
    if (!rt) { out.push(remote.lines[i]); continue; }

    const id = rt.ephemeral ? deriveId(rt.group, rt.title) : rt.id;
    if (removed.includes(id)) continue; // 本地删了

    const bt = bMap.get(id);
    const lt = lMap.get(id);

    if (!bt && !lt) { out.push(buildTaskLine(rt)); continue; } // 远端新增
    if (!lt) { out.push(buildTaskLine(rt)); continue; }        // 本地没有但也没删记录，保守保留远端

    const merged = { ...rt };
    for (const f of FIELDS) {
      const { value, conflict } = mergeField(bt, lt, rt, f);
      merged[f] = value;
      if (conflict) conflicts.push({ id, field: f });
    }
    out.push(buildTaskLine({ ...merged, id: rt.id, ephemeral: false, indent: rt.indent }));
  }

  // 远端没有、本地新增、且分组也不在远端 → 追加新分组
  for (const [group, list] of addedByGroup) {
    if (emittedGroups.has(group)) continue;
    emittedGroups.add(group);
    if (out.length && out[out.length - 1].trim() !== '') out.push('');
    out.push(`## ${group || '未分组'}`, '');
    for (const t of list) out.push(buildTaskLine({ ...t, indent: '', ephemeral: false }));
  }

  const src = (remote.bom ? '\uFEFF' : '') + out.join(remote.eol);
  return {
    src,
    conflicts,
    added: [...addedByGroup.values()].reduce((n, l) => n + l.length, 0),
    removed: removed.length,
  };
}


/* ---- src/app/github.mjs ---- */
/**
 * github.mjs —— GitHub Contents API 的浏览器客户端
 *
 * 所有行为都来自 2026-11-04 的实测，不要凭印象改：
 *  - api.github.com 回 `Access-Control-Allow-Origin: *`，且预检允许
 *    PUT/PATCH/DELETE + Authorization 头 → 浏览器可直连读 **和写**。
 *  - 未认证配额 60 次/小时/IP；**304 仍然计费**（认证后才免），
 *    所以「用 ETag 省配额」只在带 token 时成立。
 *  - `Cache-Control: max-age=60`（API）/ `max-age=300`（raw）→ 必须自己管 ETag 并加 no-store，
 *    否则本地缓存会把「刚改完」的内容吃掉。
 *  - 写回必须带 blob sha（拿不到 sha 的 PUT 会被 422 拒），故写入路径要走 JSON media type。
 */

const API = 'https://api.github.com';

const encPath = (p) => p.split('/').map(encodeURIComponent).join('/');

/* ------------------------------------------------------- base64 (UTF-8) */

function toBase64Utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}

function fromBase64Utf8(b64) {
  const clean = b64.replace(/\s/g, '');
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

/* ------------------------------------------------------------- headers */

function headers(token, extra = {}) {
  const h = {
    Accept: 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    ...extra,
  };
  if (token) h.Authorization = `Bearer ${token}`;
  return h;
}

function readRate(res) {
  const num = (k) => {
    const v = res.headers.get(k);
    return v === null ? null : Number(v);
  };
  return {
    limit: num('x-ratelimit-limit'),
    remaining: num('x-ratelimit-remaining'),
    reset: num('x-ratelimit-reset'), // epoch seconds
    retryAfter: num('retry-after'),
  };
}

class GitHubError extends Error {
  constructor(message, { status, rate, body } = {}) {
    super(message);
    this.name = 'GitHubError';
    this.status = status;
    this.rate = rate;
    this.body = body;
  }
}

/* ----------------------------------------------------------- the client */

function createClient({ owner, repo, path, branch = 'main' }) {
  if (!owner || !repo || !path) throw new Error('owner / repo / path 均为必填');

  const base = `${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encPath(path)}`;

  /**
   * 读取文件。
   * @param {object} o
   * @param {string|null} o.etag   上次的 ETag，命中则返回 304
   * @param {string|null} o.token  有 token 时 304 不计配额
   * @param {boolean} o.wantSha    写回场景需要 sha，走 JSON；纯展示走 raw 省流量
   * @returns {Promise<{status:number, content?:string, sha?:string, etag?:string, rate?:object}>}
   */
  async function read({ etag = null, token = null, wantSha = false, signal } = {}) {
    const h = headers(token, wantSha
      ? {}
      : { Accept: 'application/vnd.github.raw' });
    if (etag) h['If-None-Match'] = etag;

    const url = `${base}?ref=${encodeURIComponent(branch)}`;
    let res;
    try {
      res = await fetch(url, { headers: h, cache: 'no-store', signal });
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      throw new GitHubError('网络不可达（离线或 DNS 失败）', { status: 0 });
    }

    const rate = readRate(res);

    if (res.status === 304) return { status: 304, etag, rate };
    if (res.status === 404) {
      return { status: 404, rate, notFound: true };
    }
    if (res.status === 403 || res.status === 429) {
      throw new GitHubError(
        rate.remaining === 0 ? '配额已用尽' : '被 GitHub 拒绝（权限或频率限制）',
        { status: res.status, rate },
      );
    }
    if (!res.ok) {
      throw new GitHubError(`读取失败 HTTP ${res.status}`, { status: res.status, rate });
    }

    const newEtag = res.headers.get('etag');

    if (wantSha) {
      const j = await res.json();
      return {
        status: 200,
        content: fromBase64Utf8(j.content || ''),
        sha: j.sha,
        etag: newEtag,
        size: j.size,
        rate,
      };
    }
    return { status: 200, content: await res.text(), etag: newEtag, rate };
  }

  /**
   * 写入（整文件覆盖）。sha 不匹配时 GitHub 返 409/422 → 视为冲突，由上层重新拉取合并。
   */
  async function write({ content, sha, message, token, committer } = {}) {
    if (!token) throw new GitHubError('写回需要 token', { status: 401 });

    const body = {
      message: message || 'chore(todo): update from web',
      content: toBase64Utf8(content),
      branch,
    };
    if (sha) body.sha = sha;
    if (committer) body.committer = committer;

    const res = await fetch(base, {
      method: 'PUT',
      headers: headers(token, { 'Content-Type': 'application/json' }),
      body: JSON.stringify(body),
      cache: 'no-store',
    });

    const rate = readRate(res);
    const text = await res.text();
    let json = null;
    try { json = JSON.parse(text); } catch { /* 非 JSON 响应 */ }

    if (res.ok) {
      return { ok: true, sha: json?.content?.sha || null, commit: json?.commit?.sha || null, rate };
    }
    const conflict = res.status === 409 || res.status === 422;
    return {
      ok: false,
      conflict,
      status: res.status,
      message: json?.message || text.slice(0, 200),
      rate,
    };
  }

  /** 校验凭证与仓库可访问性，用于设置页的「测试连接」 */
  async function probe({ token = null } = {}) {
    const res = await fetch(`${API}/repos/${owner}/${repo}`, {
      headers: headers(token),
      cache: 'no-store',
    });
    const rate = readRate(res);
    if (!res.ok) return { ok: false, status: res.status, rate };
    const j = await res.json();
    return { ok: true, private: j.private, defaultBranch: j.default_branch, rate };
  }

  return { read, write, probe, url: base };
}

/* ---------------------------------------------------------------- token */

const TOKEN_KEY = 'todo-gh:token';

/** token 只存在本机 localStorage；页面不向任何第三方发送 */
function loadToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; }
}

function saveToken(t) {
  try {
    if (t) localStorage.setItem(TOKEN_KEY, t);
    else localStorage.removeItem(TOKEN_KEY);
  } catch { /* 隐私模式下静默降级为内存态 */ }
}


/* ---- src/app/sync.mjs ---- */
/**
 * sync.mjs —— 按需拉取（不做定时轮询）
 *
 * 设计前提：GitHub 上改 todo.md 会触发 Pages 重新部署，部署完页面本身没变，
 * 变的是它要读的数据。所以「拿到最新数据」只需要一件事：**点刷新时拉一次**。
 * 定时器、退避、可见性自动补拉全部去掉 —— 它们只在需要「后台保持最新」时才成立。
 *
 * 保留的只有两件仍有价值的事：
 *  - ETag 条件请求：第二次刷新大概率 304，省流量；带 token 时 304 还不计配额
 *  - 错误分型：离线 / 配额耗尽 / 被要求重试 / 文件不存在，分别给人话提示
 *
 * 不碰数据内容，也不碰 DOM（便于在 Node 里用假 client 直接单测）。
 */

function createSyncEngine({ client, getToken, onData, onStatus }) {
  let etag = null;
  let running = false;
  let phase = 'idle'; // idle | syncing | ok | not-modified | error | offline | ratelimited
  let lastOkAt = 0;
  let rate = null;
  let lastError = '';

  const emit = () => onStatus?.({ phase, lastOkAt, rate, error: lastError });

  function setPhase(p, err = '') {
    phase = p;
    lastError = err;
    emit();
  }

  /**
   * 拉一次。并发调用会被合并（第二次直接返回 skipped），
   * 避免用户连点刷新把配额打光。
   * @returns {Promise<{status?:number, skipped?:boolean, error?:string}>}
   */
  async function refresh() {
    if (running) return { skipped: true };
    running = true;
    setPhase('syncing');

    try {
      const res = await client.read({ etag, token: getToken() || null, wantSha: false });
      rate = res.rate || rate;

      if (res.status === 304) {
        // 内容没变，但「确实连上了」——记时间，别谎报失败
        lastOkAt = Date.now();
        setPhase('not-modified');
        return { status: 304 };
      }
      if (res.status === 200) {
        lastOkAt = Date.now();
        etag = res.etag || null;
        await onData(res.content, { etag, rate });
        setPhase('ok');
        return { status: 200 };
      }
      if (res.status === 404) {
        // 不能记 lastOkAt：否则界面显示「刚刚刷新过」，实际什么都没读到
        setPhase('error', '文件不存在（检查 repo / branch / path）');
        return { status: 404 };
      }
      setPhase('error', `HTTP ${res.status}`);
      return { status: res.status };
    } catch (e) {
      if (e.name === 'GitHubError' && e.rate) rate = e.rate;
      const offline = (typeof navigator !== 'undefined' && navigator.onLine === false) || e.status === 0;
      if (offline) setPhase('offline', '离线');
      else if (e.rate && e.rate.remaining === 0) setPhase('ratelimited', '配额已用尽，等重置');
      else if (e.rate?.retryAfter) setPhase('ratelimited', `被要求 ${e.rate.retryAfter}s 后重试`);
      else setPhase('error', e.message || '刷新失败');
      return { error: e.message || 'refresh failed' };
    } finally {
      running = false;
    }
  }

  /** 首屏、改配置、清缓存后调用：语义上等同刷新，单独命名便于阅读 */
  function load() {
    return refresh();
  }

  /** 写回成功后调用：更新 ETag 与时间，避免马上又拉一次 */
  function markPushed(newEtag = null) {
    if (newEtag) etag = newEtag;
    lastOkAt = Date.now();
    setPhase('ok');
  }

  function resetEtag() {
    etag = null;
  }

  return {
    load,
    refresh,
    markPushed,
    resetEtag,
    state: () => ({ phase, etag, rate, lastOkAt, error: lastError }),
  };
}


/* ---- src/app/ui.mjs ---- */
/**
 * ui.mjs —— 视图与交互层。无框架、无依赖，状态单一来源即 workSrc（Markdown 文本）。
 */





const DEMO = (typeof window !== 'undefined' && window.__DEMO_MD__) ||
  '# 我的待办\n\n## 收件箱\n\n- [ ] 双击标题可以改，点左边圆圈可以勾 #示例 <!--id:i1demo-->\n';

const LS = {
  cfg: 'todo-gh:config',
  work: 'todo-gh:work',
  base: 'todo-gh:base',
};

const DEFAULT_CFG = {
  owner: '', repo: '', branch: 'main', path: 'todo.md',
  theme: 'auto',
};

/* --------------------------------------------------------------- state */

const S = {
  cfg: { ...DEFAULT_CFG },
  remoteSrc: '',
  workSrc: '',
  doc: null,
  filters: { q: '', status: 'open', tags: [], group: '' },
  view: 'list',
  editingId: null,
  sync: {},
  busy: false,
  toast: null,
  drawer: false,
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

const dirty = () => S.workSrc !== S.remoteSrc;
const configured = () => !!(S.cfg.owner && S.cfg.repo && S.cfg.path);

/* ------------------------------------------------ 链接即配置（换机迁移） */

/**
 * 从 search / hash 解析仓库配置，hash 覆盖 search（便于 `…/#repo=owner/name` 短链）。
 * 纯函数，不碰 DOM，自检可直接调用。
 */
function urlCfgFrom(search, hash) {
  const p = new URLSearchParams();
  for (const raw of [String(search || '').replace(/^\?/, ''), String(hash || '').replace(/^#/, '')]) {
    if (!raw) continue;
    let sp;
    try { sp = new URLSearchParams(raw); } catch { continue; }
    for (const [k, v] of sp) p.set(k, v);
  }
  const out = {};
  const full = (p.get('repo') || '').trim();
  if (full) {
    const [o, r] = full.includes('/') ? full.split('/').filter(Boolean) : [];
    if (o && r) { out.owner = o; out.repo = r; }
    else {
      out.repo = full;
      const own = (p.get('owner') || '').trim();
      if (own) out.owner = own;
    }
  }
  const br = (p.get('branch') || '').trim();
  if (br) out.branch = br;
  const pa = (p.get('path') || '').trim();
  if (pa) out.path = pa;
  return out;
}

/** 把链接里的参数并进配置；用过即抹掉，避免刷新时覆盖用户手改的设置 */
function applyUrlCfg() {
  let next = {};
  try { next = urlCfgFrom(location.search, location.hash); } catch { return false; }
  if (!Object.keys(next).length) return false;
  S.cfg = { ...S.cfg, ...next };
  persistCfgOnly();
  try {
    history.replaceState(null, '', location.href.split('#')[0].split('?')[0]);
  } catch { /* file:// 下个别浏览器拒绝，参数留着也无害 */ }
  return true;
}

/** 生成可带走的链接：只含仓库坐标，绝不含 token */
function shareUrl() {
  if (!configured()) return '';
  const base = location.href.split('#')[0].split('?')[0];
  // 保留 / 不转义，链接肉眼可读
  const enc = (v) => encodeURIComponent(String(v)).replace(/%2F/g, '/');
  const q = `repo=${enc(`${S.cfg.owner}/${S.cfg.repo}`)}`
    + `&branch=${enc(S.cfg.branch || 'main')}`
    + `&path=${enc(S.cfg.path || 'todo.md')}`;
  return `${base}#${q}`;
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch { /* 降到 execCommand */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch { return false; }
}

/* ---------------------------------------------------------- persistence */

function loadLocal() {
  try {
    const cfg = JSON.parse(localStorage.getItem(LS.cfg) || 'null');
    if (cfg) S.cfg = { ...DEFAULT_CFG, ...cfg };
    S.workSrc = localStorage.getItem(LS.work) || '';
    S.remoteSrc = localStorage.getItem(LS.base) || S.workSrc;
  } catch { /* 隐私模式：纯内存运行 */ }

  if (!S.workSrc) {
    S.workSrc = DEMO;
    S.remoteSrc = DEMO;
  }
  setDoc(S.workSrc);
}

function persistCfgOnly() {
  try { localStorage.setItem(LS.cfg, JSON.stringify(S.cfg)); } catch { /* ignore */ }
}

function persist() {
  persistCfgOnly();
  try {
    localStorage.setItem(LS.work, S.workSrc);
    localStorage.setItem(LS.base, S.remoteSrc);
  } catch { /* ignore */ }
}

function setDoc(src) {
  S.doc = parse(src);
  const tags = new Set();
  for (const t of S.doc.tasks) t.tags.forEach((x) => tags.add(x));
  S.allTags = [...tags].sort();
}

function setWork(src) {
  S.workSrc = src;
  setDoc(src);
  persist();
  render();
}

/* -------------------------------------------------------------- helpers */

function fmtRelative(ts) {
  if (!ts) return '尚未同步';
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 10) return '刚刚';
  if (d < 60) return `${d} 秒前`;
  if (d < 3600) return `${Math.floor(d / 60)} 分钟前`;
  if (d < 86400) return `${Math.floor(d / 3600)} 小时前`;
  return `${Math.floor(d / 86400)} 天前`;
}

function fmtDue(due) {
  const [, m, d] = due.split('-');
  return `${Number(m)}/${Number(d)}`;
}

function toast(msg, kind = 'info', ms = 3200) {
  S.toast = { msg, kind, at: Date.now() };
  render();
  setTimeout(() => {
    if (S.toast && Date.now() - S.toast.at >= ms - 50) { S.toast = null; render(); }
  }, ms);
}

function visibleTasks() {
  const { q, status, tags, group } = S.filters;
  const needle = q.trim().toLowerCase();
  // 看板本身就是「按状态分列」，再叠一层状态筛选会永远空一列
  const byStatus = S.view !== 'board';
  return S.doc.tasks.filter((t) => {
    if (byStatus && status === 'open' && t.checked) return false;
    if (byStatus && status === 'done' && !t.checked) return false;
    if (group && t.group !== group) return false;
    if (tags.length && !tags.every((x) => t.tags.includes(x))) return false;
    if (needle) {
      const hay = `${t.title} ${t.tags.join(' ')} ${t.group}`.toLowerCase();
      if (!hay.includes(needle)) return false;
    }
    return true;
  });
}

/* ---------------------------------------------------------------- sync */

let client = null;
let engine = null;
let engineSeq = 0;

function rebuildEngine() {
  // 换配置时旧请求可能还在飞：用序号作废它的回调，避免旧仓库的响应盖到新配置上
  const seq = ++engineSeq;
  engine = null;
  client = null;
  if (!configured()) return;

  client = createClient({
    owner: S.cfg.owner, repo: S.cfg.repo, path: S.cfg.path, branch: S.cfg.branch,
  });
  engine = createSyncEngine({
    client,
    getToken: loadToken,
    onStatus: (st) => { if (seq !== engineSeq) return; S.sync = st; render(); },
    onData: (content) => {
      if (seq !== engineSeq) return;
      if (content === S.remoteSrc) {
        if (!dirty()) { S.workSrc = content; setDoc(content); }
        return;
      }
      // 远端变了。本地有未推送改动时先存着，交给用户决定是否合并
      S.remoteSrc = content;
      persist();
      if (dirty()) {
        S.remoteNewer = true;
        toast('远端有新内容，本地改动尚未合并', 'warn');
      } else {
        S.workSrc = content;
        setDoc(content);
        persist();
        render();
      }
    },
  });
  engine.load();
}

async function pushNow() {
  if (S.busy) return;
  if (!configured()) { toast('先在设置里填入仓库信息', 'warn'); S.drawer = true; render(); return; }
  const token = loadToken();
  if (!token) { toast('写回需要 Personal Access Token', 'warn'); S.drawer = true; render(); return; }

  S.busy = true;
  render();
  try {
    // 1) 拿最新内容 + blob sha（写回必须带 sha）
    const latest = await client.read({ token, wantSha: true });
    if (latest.status !== 200) throw new Error('无法读取远端最新版本');

    let target = S.workSrc;
    let mergeInfo = null;

    // 2) 远端在本地读取之后又变了 → 三方合并，不整文件覆盖
    if (latest.content !== S.remoteSrc) {
      const merged = mergeMarkdown(S.remoteSrc, S.workSrc, latest.content);
      target = merged.src;
      mergeInfo = merged;
    }

    // 3) 提交
    const res = await client.write({
      content: target,
      sha: latest.sha,
      token,
      message: `chore(todo): update ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`,
    });

    if (!res.ok) {
      if (res.conflict) {
        // sha 过期：重新拉一次再合并，最多一次
        const retry = await client.read({ token, wantSha: true });
        if (retry.status === 200) {
          const merged = mergeMarkdown(S.remoteSrc, S.workSrc, retry.content);
          const res2 = await client.write({
            content: merged.src, sha: retry.sha, token,
            message: `chore(todo): update ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`,
          });
          if (res2.ok) {
            S.remoteSrc = merged.src;
            S.workSrc = merged.src;
            setDoc(merged.src);
            persist();
            // 写回后强制下一次刷新取全文：PUT 返回的是 commit sha，不是 blob 的 ETag，不能拿来当校验值
            engine?.markPushed();
            engine?.resetEtag();
            toast(merged.conflicts.length ? `已推送，${merged.conflicts.length} 处冲突保留本地版本` : '已推送到 GitHub', 'ok');
            return;
          }
        }
      }
      throw new Error(res.message || '推送失败');
    }

    S.remoteSrc = target;
    S.workSrc = target;
    S.remoteNewer = false;
    setDoc(target);
    persist();
    engine?.markPushed();
    engine?.resetEtag();
    toast(mergeInfo?.conflicts.length
      ? `已推送，${mergeInfo.conflicts.length} 处冲突保留本地版本`
      : '已推送到 GitHub', 'ok');
  } catch (e) {
    toast(e.message || '推送失败', 'err', 5000);
  } finally {
    S.busy = false;
    render();
  }
}

async function mergeRemote() {
  if (!configured()) return;
  const token = loadToken() || null;
  try {
    const latest = await client.read({ token, wantSha: false });
    if (latest.status !== 200) { toast('远端读取失败', 'err'); return; }
    const merged = mergeMarkdown(S.remoteSrc, S.workSrc, latest.content);
    S.remoteSrc = latest.content;
    S.workSrc = merged.src;
    S.remoteNewer = false;
    setDoc(merged.src);
    persist();
    toast(merged.conflicts.length
      ? `已合并，${merged.conflicts.length} 处冲突保留本地版本`
      : '已合并远端更新', merged.conflicts.length ? 'warn' : 'ok');
  } catch (e) {
    toast(e.message || '合并失败', 'err');
  }
}

/* --------------------------------------------------------------- render */

function chipStatus() {
  const st = S.sync || {};
  const phase = st.phase || 'idle'; // 同步引擎未启动时 phase 为空，不能落到默认文案
  const map = {
    ok: ['ok', '已刷新'],
    'not-modified': ['ok', '无变化'],
    syncing: ['busy', '刷新中'],
    offline: ['warn', '离线'],
    error: ['err', st.error || '刷新失败'],
    ratelimited: ['warn', '配额受限'],
    idle: ['idle', configured() ? '待刷新' : '演示模式'],
  };
  const [kind, label] = map[phase] || ['idle', '未知'];
  return `<span class="dot dot--${kind}"></span><span class="chip-label">${esc(label)}</span>`;
}

/** 编辑框里展示的是「整行正文」（标题 + 标签 + 截止 + 优先级），与解析规则对称 */
function inlineValue(t) {
  return [t.title]
    .concat(t.tags.map((x) => '#' + x))
    .concat(t.due ? [`@due(${t.due})`] : [])
    .concat(typeof t.priority === 'number' ? [`!p${t.priority}`] : [])
    .filter(Boolean)
    .join(' ');
}

function taskHTML(t) {
  const overdue = isOverdue(t);
  const editing = S.editingId === t.id;
  const meta = [];
  for (const tag of t.tags) meta.push(`<button class="tag" data-act="tag" data-tag="${esc(tag)}">#${esc(tag)}</button>`);
  if (t.due) meta.push(`<span class="due ${overdue ? 'due--over' : ''}">${esc(fmtDue(t.due))}${overdue ? ' 逾期' : ''}</span>`);
  if (typeof t.priority === 'number') meta.push(`<span class="prio prio--${t.priority}">P${t.priority}</span>`);

  return `
    <li class="task ${t.checked ? 'task--done' : ''} ${overdue ? 'task--over' : ''}" data-id="${esc(t.id)}">
      <button class="check" data-act="toggle" aria-label="${t.checked ? '取消完成' : '标记完成'}" aria-pressed="${t.checked}">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" /></svg>
      </button>
      <div class="task-main">
        ${editing
          ? `<input class="edit" value="${esc(inlineValue(t))}" data-id="${esc(t.id)}" aria-label="编辑任务" />`
          : `<div class="task-title" data-act="edit" title="单击编辑">${esc(t.title)}</div>`}
        ${meta.length && !editing ? `<div class="task-meta">${meta.join('')}</div>` : ''}
      </div>
      <button class="icon-btn task-del" data-act="del" aria-label="删除">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
      </button>
    </li>`;
}

function listHTML(tasks) {
  if (!tasks.length) return `<div class="empty">没有符合条件的任务</div>`;
  const byGroup = new Map();
  for (const t of tasks) {
    const k = t.group || '未分组';
    if (!byGroup.has(k)) byGroup.set(k, []);
    byGroup.get(k).push(t);
  }
  return [...byGroup].map(([group, items]) => {
    const done = items.filter((t) => t.checked).length;
    return `
      <section class="group">
        <header class="group-head">
          <h2>${esc(group)}</h2>
          <span class="group-count">${done}/${items.length}</span>
        </header>
        <ul class="task-list">${items.map(taskHTML).join('')}</ul>
      </section>`;
  }).join('');
}

function boardHTML(tasks) {
  const cols = [
    { key: 'open', label: '进行中', items: tasks.filter((t) => !t.checked) },
    { key: 'done', label: '已完成', items: tasks.filter((t) => t.checked) },
  ];
  return `<div class="board">${cols.map((c) => `
    <div class="col">
      <div class="col-head"><span>${c.label}</span><b>${c.items.length}</b></div>
      <ul class="task-list">${c.items.length ? c.items.map(taskHTML).join('') : '<li class="empty-mini">—</li>'}</ul>
    </div>`).join('')}</div>`;
}

function statsHTML() {
  const st = stats(S.doc.tasks);
  const over = S.doc.tasks.filter((t) => isOverdue(t)).length;
  return `
    <div class="stats">
      <div class="stat"><b>${st.open}</b><span>待办</span></div>
      <div class="stat"><b>${st.done}</b><span>完成</span></div>
      <div class="stat ${over ? 'stat--warn' : ''}"><b>${over}</b><span>逾期</span></div>
      <div class="stat"><b>${st.pct}%</b><span>完成率</span></div>
      <div class="bar"><i style="width:${st.pct}%"></i></div>
    </div>`;
}

function toolbarHTML() {
  const f = S.filters;
  const tabs = [['open', '待办'], ['done', '已完成'], ['all', '全部']];
  return `
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="q" placeholder="搜索任务、标签、分组" value="${esc(f.q)}" />
      </div>
      <div class="seg ${S.view === 'board' ? 'seg--off' : ''}" role="tablist" title="${S.view === 'board' ? '看板已按状态分列，此项不生效' : ''}">
        ${tabs.map(([k, label]) => `<button role="tab" data-status="${k}" class="${f.status === k ? 'on' : ''}">${label}</button>`).join('')}
      </div>
      <div class="view-toggle">
        <button data-view="list" class="${S.view === 'list' ? 'on' : ''}" title="分组列表">列表</button>
        <button data-view="board" class="${S.view === 'board' ? 'on' : ''}" title="看板">看板</button>
      </div>
    </div>
    ${S.allTags.length ? `<div class="tagbar">
      ${S.allTags.map((t) => `<button class="tag ${f.tags.includes(t) ? 'tag--on' : ''}" data-act="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}
      ${f.tags.length ? '<button class="clear-tags" data-act="clear-tags">清除</button>' : ''}
    </div>` : ''}`;
}

function composerHTML() {
  const groups = S.doc.groups.filter((g) => g.role !== 'title').map((g) => g.title);
  const target = S.filters.group || groups[0] || '收件箱';
  return `
    <form class="composer" id="composer">
      <select id="new-group" aria-label="分组">
        ${groups.map((g) => `<option ${g === target ? 'selected' : ''}>${esc(g)}</option>`).join('')}
        <option value="__new">+ 新分组…</option>
      </select>
      <input id="new-title" placeholder="加一条…#标签 @due(2026-11-10) !p1" autocomplete="off" />
      <button type="submit" class="btn-primary">添加</button>
    </form>`;
}

function bannerHTML() {
  const parts = [];
  if (!configured()) {
    parts.push(`<div class="banner banner--demo">演示模式 · 数据只在本机
      <button data-act="drawer" class="link">连接 GitHub 仓库 →</button></div>`);
  }
  if (S.remoteNewer && dirty()) {
    parts.push(`<div class="banner banner--warn">远端有更新，本地也有改动
      <button data-act="merge" class="link">合并（保留双方改动）</button></div>`);
  } else if (dirty()) {
    parts.push(`<div class="banner banner--draft">本地有未推送改动${configured() ? '' : '，连上仓库后才会写回'}
      <button data-act="${configured() ? 'push' : 'drawer'}" class="link">${configured() ? '立即推送' : '去设置'}</button></div>`);
  }
  return parts.join('');
}

function drawerHTML() {
  if (!S.drawer) return '';
  const c = S.cfg;
  const hasToken = !!loadToken();
  return `
  <div class="drawer-mask" data-act="drawer-close"></div>
  <aside class="drawer" role="dialog" aria-label="设置">
    <header><h3>同步设置</h3><button class="icon-btn" data-act="drawer-close" aria-label="关闭">×</button></header>

    <label class="field"><span>仓库（owner/repo）</span>
      <div class="row">
        <input id="cfg-owner" placeholder="owner" value="${esc(c.owner)}" />
        <span class="slash">/</span>
        <input id="cfg-repo" placeholder="repo" value="${esc(c.repo)}" />
      </div>
    </label>
    <div class="row2">
      <label class="field"><span>分支</span><input id="cfg-branch" value="${esc(c.branch)}" /></label>
      <label class="field"><span>文件路径</span><input id="cfg-path" value="${esc(c.path)}" /></label>
    </div>
    <label class="field"><span>Personal Access Token ${hasToken ? '<em class="ok-mark">已保存</em>' : ''}</span>
      <input id="cfg-token" type="password" placeholder="github_pat_… （仅存本机）" value="" />
    </label>
    <p class="hint">
      Fine-grained token，只勾这一个仓库的 <b>Contents: Read and write</b> 即可。
      留空表示只读模式（页面不写回，改动仅存本地）。
    </p>
    <div class="drawer-actions">
      <button class="btn-ghost" data-act="probe">测试连接</button>
      <button class="btn-primary" data-act="save-cfg">保存并刷新</button>
    </div>
    <div class="drawer-foot">
      <div class="foot-links">
        <button class="link" data-act="copy-link">复制带配置的链接</button>
        <button class="link" data-act="reset-local">清空本地缓存</button>
      </div>
      <span class="ver">v1.2</span>
    </div>
    <p class="hint hint--foot">
      不做后台轮询：在 GitHub 上改完 todo.md、等 Actions 部署完，点顶栏的刷新按钮取一次最新内容。
    </p>
    <p class="hint hint--foot">
      链接只带仓库坐标，不含 token。换电脑/换浏览器打开它即自动连上，token 需在新设备单独填一次
      （凭据不跟着链接走，这是有意的）。
    </p>
  </aside>`;
}

/* --------------------------------------------------------------- theme */

const THEMES = [
  { key: 'auto', label: '跟随系统' },
  { key: 'light', label: '浅色' },
  { key: 'dark', label: '深色' },
];

function themeLabel() {
  return (THEMES.find((t) => t.key === S.cfg.theme) || THEMES[0]).label;
}

/** auto → 不写 data-theme（交给 prefers-color-scheme）；light/dark → 显式覆盖 */
function applyTheme() {
  const t = S.cfg.theme === 'light' || S.cfg.theme === 'dark' ? S.cfg.theme : '';
  const root = document.documentElement;
  if (t) root.setAttribute('data-theme', t);
  else root.removeAttribute('data-theme');
}

function themeIcon() {
  const t = S.cfg.theme;
  if (t === 'light') {
    return '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.3v1.9M8 12.8v1.9M1.3 8h1.9M12.8 8h1.9M3.2 3.2l1.35 1.35M11.45 11.45l1.35 1.35M12.8 3.2l-1.35 1.35M4.55 11.45L3.2 12.8"/></svg>';
  }
  if (t === 'dark') {
    return '<svg viewBox="0 0 16 16"><path d="M13.6 9.7A5.9 5.9 0 0 1 6.3 2.4a5.9 5.9 0 1 0 7.3 7.3Z"/></svg>';
  }
  // auto：半明半暗，避免和“浅色”那个太阳混淆
  return '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.4"/><path d="M8 2.6v10.8a5.4 5.4 0 0 0 0-10.8Z" fill="currentColor" stroke="none"/></svg>';
}

function render() {
  const app = $('#app');
  const tasks = visibleTasks();
  const st = S.sync || {};
  const isDemo = !configured();

  app.innerHTML = `
    <header class="top">
      <div class="brand">
        <div class="brand-mark">✓</div>
        <div>
          <h1>${esc(S.doc.groups.find((g) => g.role === 'title')?.title || '我的待办')}</h1>
          <div class="sub">${esc(S.cfg.owner ? `${S.cfg.owner}/${S.cfg.repo}` : '本地演示')} · ${fmtRelative(st.lastOkAt)}</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="chip ${isDemo ? 'chip--demo' : ''}">${chipStatus()}</div>
        <button class="icon-btn" data-act="theme" aria-label="主题：${themeLabel()}" title="主题：${themeLabel()}（点击切换）">
          ${themeIcon()}
        </button>
        <button class="icon-btn" data-act="sync" aria-label="刷新" title="刷新（从 GitHub 拉取最新内容）">
          <svg viewBox="0 0 16 16" class="${st.phase === 'syncing' ? 'spin' : ''}"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5V5H11"/></svg>
        </button>
        <button class="icon-btn" data-act="drawer" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24" class="ico-gear"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>
    </header>

    ${statsHTML()}
    ${bannerHTML()}
    ${toolbarHTML()}

    <main class="content">
      ${S.view === 'board' ? boardHTML(tasks) : listHTML(tasks)}
    </main>

    ${composerHTML()}
    <footer class="foot">
      <span class="count">${tasks.length} / ${S.doc.tasks.length} 条显示</span>
      <span class="sep">·</span>
      <span>${dirty() ? '<b class="warn-mark">未推送</b>' : '已同步'}</span>
      ${st.rate?.remaining !== null && st.rate?.remaining !== undefined
        ? `<span class="sep">·</span><span title="未认证每小时 60 次">配额 ${st.rate.remaining}/${st.rate.limit}</span>` : ''}
    </footer>

    ${drawerHTML()}
    ${S.toast ? `<div class="toast toast--${S.toast.kind}">${esc(S.toast.msg)}</div>` : ''}
  `;

  if (S.editingId) {
    const el = $('.edit');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  const q = $('#q');
  if (q && S.filters.q) {
    // 保持光标位置：仅在搜索框不是当前焦点时重设
    if (document.activeElement !== q) q.value = S.filters.q;
  }
}

/**
 * 只重绘列表区域。搜索输入走这条路径：
 * 全量 render 会替换掉 <input>，导致光标跳动、中文输入法候选框被打断。
 */
function renderListOnly() {
  const tasks = visibleTasks();
  const main = $('.content');
  if (main) main.innerHTML = S.view === 'board' ? boardHTML(tasks) : listHTML(tasks);
  const cnt = $('.foot .count');
  if (cnt) cnt.textContent = `${tasks.length} / ${S.doc.tasks.length} 条显示`;
}

/* --------------------------------------------------------------- events */

function mutate(fn) {
  const before = S.workSrc;
  const r = fn(S.workSrc);
  if (r && r.src !== undefined && r.src !== before) {
    setWork(r.src);
  }
  return r;
}

document.addEventListener('click', async (e) => {
  const actEl = e.target.closest('[data-act]');
  const statusBtn = e.target.closest('[data-status]');
  const viewBtn = e.target.closest('[data-view]');

  if (statusBtn) { S.filters.status = statusBtn.dataset.status; render(); return; }
  if (viewBtn) {
    S.view = viewBtn.dataset.view;
    if (S.view === 'board') S.filters.status = 'all';
    render();
    return;
  }
  if (!actEl) return;

  const act = actEl.dataset.act;
  const id = actEl.closest('.task')?.dataset.id;

  switch (act) {
    case 'toggle': {
      const t = S.doc.tasks.find((x) => x.id === id);
      if (!t) return;
      mutate((src) => toggleTask(src, id, !t.checked, { trackDoneDate: true }));
      break;
    }
    case 'edit':
      S.editingId = id;
      render();
      break;
    case 'del': {
      const t = S.doc.tasks.find((x) => x.id === id);
      if (!t) return;
      if (!confirm(`删除「${t.title}」？会从 Markdown 里移除这一行。`)) return;
      mutate((src) => removeTask(src, id));
      toast('已删除，可在推送前撤销（刷新页面前有效）', 'info');
      break;
    }
    case 'tag': {
      const tag = actEl.dataset.tag;
      if (actEl.closest('.tagbar')) {
        const i = S.filters.tags.indexOf(tag);
        if (i >= 0) S.filters.tags.splice(i, 1); else S.filters.tags.push(tag);
      } else {
        S.filters.tags = [tag];
      }
      render();
      break;
    }
    case 'clear-tags':
      S.filters.tags = [];
      render();
      break;
    case 'sync': {
      if (!engine) { toast('先连接仓库', 'warn'); S.drawer = true; render(); return; }
      const r = await engine.refresh();
      if (r?.skipped) toast('正在刷新，请稍候', 'info', 1500);
      else if (r?.status === 304) toast('已是最新内容', 'info', 1800);
      else if (r?.status === 200) toast('已取到最新内容', 'ok', 1800);
      break;
    }
    case 'push':
      await pushNow();
      break;
    case 'merge':
      await mergeRemote();
      break;
    case 'theme': {
      const i = THEMES.findIndex((x) => x.key === (S.cfg.theme || 'auto'));
      S.cfg.theme = THEMES[(i + 1) % THEMES.length].key;
      applyTheme();
      persistCfgOnly();
      render();
      toast(`主题：${themeLabel()}`, 'info', 1500);
      break;
    }
    case 'drawer':
      S.drawer = true;
      render();
      break;
    case 'drawer-close':
      S.drawer = false;
      render();
      break;
    case 'save-cfg': {
      S.cfg.owner = $('#cfg-owner').value.trim();
      S.cfg.repo = $('#cfg-repo').value.trim();
      S.cfg.branch = $('#cfg-branch').value.trim() || 'main';
      S.cfg.path = $('#cfg-path').value.trim() || 'todo.md';
      const tk = $('#cfg-token').value.trim();
      if (tk) saveToken(tk);
      persist();
      S.drawer = false;
      rebuildEngine();
      render();
      toast(configured() ? '已连接，正在拉取最新内容…' : '请填写 owner 与 repo', configured() ? 'ok' : 'warn');
      break;
    }
    case 'probe': {
      const owner = $('#cfg-owner').value.trim();
      const repo = $('#cfg-repo').value.trim();
      if (!owner || !repo) { toast('先填 owner 与 repo', 'warn'); return; }
      const tk = $('#cfg-token').value.trim() || loadToken() || null;
      try {
        const c = createClient({ owner, repo, path: $('#cfg-path').value.trim() || 'todo.md', branch: $('#cfg-branch').value.trim() || 'main' });
        const r = await c.probe({ token: tk });
        toast(r.ok
          ? `连通 · ${r.private ? '私有' : '公开'}仓库 · 默认分支 ${r.defaultBranch}`
          : `失败 HTTP ${r.status}（检查仓库名或 token 权限）`, r.ok ? 'ok' : 'err', 4200);
      } catch (err) {
        toast(err.message || '连接失败', 'err');
      }
      break;
    }
    case 'copy-link': {
      if (!configured()) { toast('先在设置里填入仓库信息', 'warn'); return; }
      const url = shareUrl();
      const ok = await copyText(url);
      const local = location.protocol === 'file:';
      toast(
        !ok ? `复制失败，手动拷贝：${url}`
          : local ? '已复制（本地文件路径只在同机同路径有效，部署到 Pages 才是跨设备链接）'
            : '已复制，换设备打开即自动连上',
        ok && !local ? 'ok' : 'warn', 5200,
      );
      break;
    }
    case 'reset-local': {
      if (!confirm('清空本地缓存并重新从 GitHub 拉取？（未推送的改动会丢失）')) return;
      try {
        localStorage.removeItem(LS.work);
        localStorage.removeItem(LS.base);
      } catch { /* ignore */ }
      S.workSrc = ''; S.remoteSrc = ''; S.remoteNewer = false;
      rebuildEngine();
      toast('已清空，等待同步', 'ok');
      break;
    }
    default:
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    S.filters.q = e.target.value;
    renderListOnly();
  }
});

function commitEdit(id, raw) {
  const t = S.doc.tasks.find((x) => x.id === id);
  S.editingId = null;
  const val = String(raw || '').trim();
  if (!val || !t) { render(); return; }
  const parsed = parseInline(val, t.group);
  mutate((src) => updateTask(src, id, {
    title: parsed.title || t.title,
    tags: parsed.tags,
    due: parsed.due,
    priority: parsed.priority,
    doneAt: t.doneAt, // 编辑不应抹掉完成日期
  }));
}

document.addEventListener('keydown', (e) => {
  if (e.target.classList?.contains('edit')) {
    if (e.key === 'Enter') {
      commitEdit(e.target.dataset.id, e.target.value);
    } else if (e.key === 'Escape') {
      S.editingId = null;
      render();
    }
  }
  if (e.key === '/' && !/input|textarea|select/i.test(e.target.tagName)) {
    e.preventDefault();
    $('#q')?.focus();
  }
});

// 点走焦点也算确认，避免编辑框永久停留
document.addEventListener('focusout', (e) => {
  if (!e.target.classList?.contains('edit')) return;
  const id = e.target.dataset.id;
  if (S.editingId !== id) return; // Enter/Esc 已处理
  commitEdit(id, e.target.value);
});

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'composer') return;
  e.preventDefault();
  const input = $('#new-title');
  const raw = input.value.trim();
  if (!raw) return;

  let group = $('#new-group').value;
  if (group === '__new') {
    group = prompt('新分组名称') || '收件箱';
  }
  const parsed = parseInline(raw, group);
  if (!parsed.title) { toast('标题不能为空', 'warn'); return; }

  mutate((src) => addTask(src, {
    group, title: parsed.title, tags: parsed.tags, due: parsed.due, priority: parsed.priority,
  }));
  input.value = '';
  input.focus();
});

/* ----------------------------------------------------------------- boot */

loadLocal();
const cfgedFromUrl = applyUrlCfg();
applyTheme(); // 先落主题属性再渲染，避免浅色用户在深色底上闪一下
rebuildEngine();
render();
if (cfgedFromUrl) toast('已按链接参数连接仓库', 'ok');

window.__todo = { S, pushNow, mergeRemote, urlCfgFrom, shareUrl, applyUrlCfg }; // 便于自检脚本驱动
</script>
</body>
</html>
