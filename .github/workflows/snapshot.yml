name: todo snapshot

# 形态 C 专用：私有仓库 + 不想在页面里放 token 时启用。
# 公开仓库直连（形态 A/B）不需要这个 workflow。

on:
  schedule:
    - cron: '*/15 * * * *'   # GitHub 最小间隔 5 分钟，实际常排队 8~15 分钟
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'todo.md'
      - 'src/core/md.mjs'
      - 'scripts/make-snapshot.mjs'

permissions:
  contents: write

concurrency:
  group: todo-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 data/todo.json
        run: node scripts/make-snapshot.mjs

      - name: 有变化才提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/todo.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(todo): refresh snapshot"
            git push
          fi
